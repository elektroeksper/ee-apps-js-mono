# Buildpack configuration for Firebase App Hosting
[build]
exclude = ["node_modules", ".next", ".git", "*.log"]

[[build.buildpacks]]
id = "google.nodejs.runtime"

[[build.buildpacks]]
id = "google.nodejs.npm"

[[build.buildpacks]]
id = "google.nodejs.next-js"

[build.env]
NEXT_OUTPUT_STANDALONE = "true"
NODE_ENV = "production"