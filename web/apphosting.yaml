    value: AIzaSyAvWTu0V1AZ26UdwZgl2U1lGKLTFH6XC-s
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
