# Settings for Backend (on Cloud Run) - TEST Environment
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Build configuration for standalone web deployment
# Build commands will run from web directory
# Shared types are copied before deployment by the deployment script
build:
  commands:
    # Install pnpm globally
    - npm install -g pnpm@latest
    # Install dependencies with frozen lockfile (standalone web lockfile)
    - pnpm install --frozen-lockfile
    # Verify shared types are present (should be copied before deployment)
    - node scripts/verify-shared-types.js
    # Build the Next.js application
    - pnpm run build

# Environment variables and secrets - TEST ENVIRONMENT
env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_REST_API_ENDPOINT
    value: https://ee-next-test--ee-prod-apps.europe-west4.hosted.app/api
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ee-next-test--ee-prod-apps.europe-west4.hosted.app/
    availability:
      - BUILD
      - RUNTIME
  # Firebase Configuration - EE-PROD-APPS
